# postgis/postgis 이미지에는 postgis / pg_trgm / unaccent 확장이 모두 포함
# (pg_trgm, unaccent 는 postgres contrib 기본 포함, postgis 는 이 이미지가 제공)

services:
  db:
    image: imresamu/postgis:16-3.4
    container_name: tripaw-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripaw
      POSTGRES_PASSWORD: tripaw_local
      POSTGRES_DB: tripaw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripaw -d tripaw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
